name: 22Download daily Dukascopy ticks to Hugging Face

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (e.g. XAUUSD)"
        required: true
        default: "XAUUSD"
      year:
        description: "Year to backfill as daily BIN files; leave empty to use start/end"
        required: false
        default: ""
      start:
        description: "Start date (YYYY-MM-DD) — ignored when Year is set"
        required: false
        default: ""
      end:
        description: "End date (YYYY-MM-DD) — ignored when Year is set"
        required: false
        default: ""
      workers:
        description: "Concurrent workers (max 64)"
        required: false
        default: "15"

permissions:
  contents: read

env:
  HF_DATASET: ${{ vars.HF_DATASET || 'Esmaeil9ss/Tickdata' }}

jobs:
  backfill-daily-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve date range
        id: dates
        run: |
          YEAR="${{ inputs.year }}"
          if [ -n "$YEAR" ]; then
            if ! [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then echo "error: Year must be 4 digits" >&2; exit 1; fi
            echo "start=$YEAR-01-01" >> "$GITHUB_OUTPUT"
            echo "end=$YEAR-12-31" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.start }}" ] && [ -n "${{ inputs.end }}" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            echo "error: fill either Year or both Start/End dates" >&2; exit 1
          fi
      - name: Download, pack and upload month by month
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          start="${{ steps.dates.outputs.start }}"
          end="${{ steps.dates.outputs.end }}"
          symbol="${{ inputs.symbol }}"
          workers="${{ inputs.workers }}"

          current="$start"
          final_stop=$(date -u -d "$end + 1 day" +%F)

          while [[ "$current" < "$final_stop" ]]; do
            month_start="$current"
            next_month=$(date -u -d "$(date -u -d "$month_start" +%Y-%m-01) + 1 month" +%F)
            month_end=$(date -u -d "$next_month - 1 day" +%F)
            if [[ "$month_end" > "$end" ]]; then month_end="$end"; fi
            echo "===== MONTH CHUNK: $symbol $month_start -> $month_end ====="
            rm -rf data/yearly
            mkdir -p data/yearly

            d="$month_start"
            stop=$(date -u -d "$month_end + 1 day" +%F)
            while [[ "$d" < "$stop" ]]; do
              echo "=== $symbol $d ==="
              python main.py download "$symbol" "$d" "$d" --workers "$workers" --min-lag-hours 0 || true
              python export/daily_pack.py "$symbol" "$d" "$d" || true
              d=$(date -u -d "$d + 1 day" +%F)
            done

            echo "===== UPLOAD MONTH CHUNK TO HF: $symbol $month_start -> $month_end ====="
            python export/huggingface_upload.py data/yearly --repo-id "$HF_DATASET"

            rm -rf "data/$symbol" data/yearly
            current=$(date -u -d "$month_end + 1 day" +%F)
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-${{ inputs.symbol }}-${{ steps.dates.outputs.start }}_${{ steps.dates.outputs.end }}-metadata
          path: data/metadata.db
          if-no-files-found: ignore
          retention-days: 7
