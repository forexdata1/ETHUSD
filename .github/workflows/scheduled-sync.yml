name: Scheduled daily tick sync to Hugging Face

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols"
        required: false
        default: "ETHUSD"
      start:
        description: "Optional override start date (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "Optional override end date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

env:
  DEFAULT_SYMBOLS: "XAUUSD"
  HF_DATASET: Esmaeil9ss/Tickdata

jobs:
  daily-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute dates
        id: dates
        run: |
          if [ -n "${{ inputs.start }}" ] && [ -n "${{ inputs.end }}" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"; echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            echo "start=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"; echo "end=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and build daily BIN packs
        env:
          SYMBOLS: ${{ inputs.symbols || env.DEFAULT_SYMBOLS }}
        run: |
          rc=0
          for sym in $SYMBOLS; do
            echo "=== $sym ${{ steps.dates.outputs.start }} -> ${{ steps.dates.outputs.end }} ==="
            python main.py download "$sym" "${{ steps.dates.outputs.start }}" "${{ steps.dates.outputs.end }}" --workers 15 --min-lag-hours 0 || rc=1
            python export/daily_pack.py "$sym" "${{ steps.dates.outputs.start }}" "${{ steps.dates.outputs.end }}" || rc=1
          done
          exit $rc
      - name: Upload daily BIN packs to Hugging Face in one commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python export/huggingface_upload.py data/yearly --repo-id "$HF_DATASET"
